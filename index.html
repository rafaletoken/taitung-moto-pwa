<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="台東機旅">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<title>台東知本｜機車旅遊</title>
</head>
<body>
<div class="app-shell">
<header class="topbar"><div><div class="eyebrow">MOTORCYCLE TRIP</div><h1 id="trip-title">台東知本溫泉</h1><div id="trip-date" class="muted"></div></div><button id="install-help" class="icon-btn">＋</button></header>
<main>
<section class="hero card"><div class="hero-row"><div><div class="badge">🏍️ 機車旅行</div><h2>避開高速／收費／渡船</h2><p class="muted">實際轉彎導航交給 Google Maps</p></div><div id="weather-mini" class="weather-mini">天氣載入中…</div></div>
<div class="quick-grid"><button class="quick" onclick="showDay(1)">DAY 1<br><span>11/13</span></button><button class="quick" onclick="showDay(2)">DAY 2<br><span>11/14</span></button><button class="quick" onclick="scrollToSection('weather')">天氣<br><span>預報</span></button><button class="quick" onclick="shareTrip()">分享<br><span>行程</span></button></div></section>
<section class="card status-card"><div class="section-head"><h2>目前行程</h2><span id="status-text" class="status-pill">準備出發</span></div><div id="progress-bar"><span></span></div><div class="status-grid"><div><b id="current-stop">—</b><small>完成狀態</small></div><div><b id="next-stop">—</b><small>下一站</small></div><div><b id="remaining">—</b><small>剩餘節點</small></div></div></section>
<section id="itinerary" class="section"><div class="section-head"><h2>行程時間軸</h2><button class="text-btn" onclick="resetProgress()">重設進度</button></div><div id="days"></div></section>
<section id="weather" class="section"><div class="section-head"><h2>天氣</h2><button class="text-btn" onclick="loadWeather()">更新</button></div><div id="weather-panel" class="card">正在取得台東知本天氣…</div></section>
<section class="card tips"><h2>騎車提醒</h2><ul><li>導航按鈕會開啟 Google Maps 景點連結。</li><li>本版行程設定為機車旅行，優先避開高速公路、收費道路、渡船。</li><li>騎乘中不要操作手機；出發前先設定導航。</li></ul></section>
</main>
<nav class="bottom-nav"><button onclick="scrollToSection('itinerary')">📍<span>行程</span></button><button onclick="scrollToSection('weather')">🌤️<span>天氣</span></button><button onclick="shareTrip()">↗<span>分享</span></button></nav>
</div><div id="toast" class="toast"></div><script src="js/app.js"></script>
</body></html>
